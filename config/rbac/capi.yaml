apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-infrastructure-capi
  labels:
    cluster.x-k8s.io/aggregate-to-manager: "true"
    kubeadm.controlplane.cluster.x-k8s.io/aggregate-to-manager: "true"
rules:
  - apiGroups:
      - homelab.infrastructure.cluster.x-k8s.io
    resources:
      - homelabclusters
      - homelabmachines
      - homelabmachinetemplates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
