apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vxnip-infrastructure-capi
  labels:
    cluster.x-k8s.io/aggregate-to-manager: "true"
    kubeadm.controlplane.cluster.x-k8s.io/aggregate-to-manager: "true"
rules:
  - apiGroups:
      - vxnip.infrastructure.cluster.x-k8s.io
    resources:
      - vxnipclusters
      - vxnipmachines
      - vxnipmachinetemplates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
