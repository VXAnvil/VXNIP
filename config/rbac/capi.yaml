apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmetal-infrastructure-capi
  labels:
    cluster.x-k8s.io/aggregate-to-manager: "true"
    kubeadm.controlplane.cluster.x-k8s.io/aggregate-to-manager: "true"
rules:
  - apiGroups:
      - vmetal.infrastructure.cluster.x-k8s.io
    resources:
      - vmetalclusters
      - vmetalmachines
      - vmetalmachinetemplates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
