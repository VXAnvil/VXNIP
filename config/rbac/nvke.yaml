# Apply to the isolated NVKE development environment. Adjust the namespaces
# and service account for the deployment if they differ from these defaults.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vxnip-infrastructure-nvke
  namespace: nvke-system
rules:
  - apiGroups:
      - infrastructure.cluster.x-k8s.io
    resources:
      - vxnipclusters
      - vxnipmachines
      - vxnipmachinetemplates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vxnip-infrastructure-nvke
  namespace: nvke-system
subjects:
  - kind: ServiceAccount
    name: nvke-controller
    namespace: nvke-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vxnip-infrastructure-nvke
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vxnip-infrastructure-nvke-crds
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      - vxnipclusters.infrastructure.cluster.x-k8s.io
      - vxnipmachines.infrastructure.cluster.x-k8s.io
      - vxnipmachinetemplates.infrastructure.cluster.x-k8s.io
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vxnip-infrastructure-nvke-crds
subjects:
  - kind: ServiceAccount
    name: nvke-controller
    namespace: nvke-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vxnip-infrastructure-nvke-crds
