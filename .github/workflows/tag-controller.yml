name: Tag VMetal controller image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  promote:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Promote the published multi-platform image
        shell: bash
        env:
          IMAGE: ghcr.io/xdu31/cluster-api-provider-vmetal
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'The Git tag must also be a valid OCI tag.' >&2
            exit 1
          fi
          commit=$(git rev-parse 'HEAD^{commit}')
          digest_of() {
            docker buildx imagetools inspect --raw "$1" | sha256sum | cut -d ' ' -f 1
          }
          # A branch and its release tag can arrive in the same push.
          for attempt in {1..30}; do
            if digest=$(digest_of "$IMAGE:$commit"); then break; fi
            if (( attempt == 30 )); then
              echo "Missing image for $commit. Check the branch publish run and retry." >&2
              exit 1
            fi
            sleep 20
          done
          version="$IMAGE:$GITHUB_REF_NAME"
          docker buildx imagetools create --tag "$version" "$IMAGE@sha256:$digest"
          test "$(digest_of "$version")" = "$digest"
          echo "Published $version at sha256:$digest" >> "$GITHUB_STEP_SUMMARY"
